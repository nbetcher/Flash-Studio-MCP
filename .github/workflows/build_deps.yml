on:
  workflow_call:
    inputs:
      cache-key:
        required: true
        type: string
      cache-path:
        required: true
        type: string
      valid-cache:
        required: true
        type: boolean
      os:
        required: true
        type: string
      arch:
        required: false
        type: string
      build-deps-only:
        required: false
        type: boolean

jobs:
  build_deps:
    name: Build Deps
    if: inputs.build-deps-only || inputs.valid-cache != true
    runs-on: ${{ inputs.os }}
    env:
      date:
    steps:

      # Setup the environment
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: 'true'

      - name: load cached deps
        uses: actions/cache/restore@v6
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ inputs.cache-key }}

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.28.0"  # use most recent 3.28.x version

      - name: setup dev on Windows
        if: startsWith(inputs.os, 'windows')
        uses: microsoft/setup-msbuild@v3

      - name: Get the date on Ubuntu and macOS
        if: ${{ !startsWith(inputs.os, 'windows') }}
        run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_ENV
        shell: bash

      - name: Get the date on Windows
        if: startsWith(inputs.os, 'windows')
        run: echo "date=$(Get-Date -Format 'yyyyMMdd')" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
        shell: pwsh


      # Build Dependencies
      # Fail loudly if the runner image ever swaps VS 2022 out again. Without this
      # the CMake "could not find any instance of Visual Studio" error is buried in
      # a step that still reports success (see the exit-code handling below).
      - name: Verify Visual Studio 2022 is present
        if: startsWith(inputs.os, 'windows')
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -products * -version "[17.0,18.0)" -requires Microsoft.Component.MSBuild -property installationPath -latest
          if (-not $vs) {
              & $vswhere -products * -property catalog_productDisplayVersion
              throw "No Visual Studio 2022 (v17) on this runner. build_release_vs2022.bat generates for 'Visual Studio 17 2022'; pick a runner image that still ships it, or move the generator to the version above."
          }
          Write-Host "Found Visual Studio 2022 at $vs"

      - name: Build on Windows
        if: startsWith(inputs.os, 'windows')
        working-directory: ${{ github.workspace }}
        run: |
            # Each command's exit code is checked explicitly: the pwsh wrapper only
            # propagates the LAST statement's status, so a failed dependency build
            # followed by a successful `pack` used to mark this step green and leave
            # the cache empty - which then surfaced far away as a cache miss.
            choco install strawberryperl
            if ($LASTEXITCODE -ne 0) { throw "choco install strawberryperl failed ($LASTEXITCODE)" }
            .\build_release_vs2022.bat deps
            if ($LASTEXITCODE -ne 0) { throw "build_release_vs2022.bat deps failed ($LASTEXITCODE)" }
            .\build_release_vs2022.bat pack
            if ($LASTEXITCODE -ne 0) { throw "build_release_vs2022.bat pack failed ($LASTEXITCODE)" }

      # The deps build can leave a partial tree behind (a failed dependency used to
      # return success). Check the bundle really contains wxWidgets before anyone
      # caches it - a poisoned cache would otherwise be restored by every later run
      # and fail far away, while configuring the slicer.
      - name: Verify the dependency bundle is complete
        if: startsWith(inputs.os, 'windows')
        shell: pwsh
        run: |
          $dest = "${{ inputs.cache-path }}"
          if (-not (Test-Path $dest)) { throw "Dependency destdir $dest does not exist - nothing was built." }
          $wx = Get-ChildItem -Path $dest -Recurse -Filter 'wx*.lib' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $wx) {
              Write-Host "--- top of $dest ---"
              Get-ChildItem -Path $dest -Recurse -Depth 3 -ErrorAction SilentlyContinue |
                  Select-Object -ExpandProperty FullName -First 60 | ForEach-Object { Write-Host $_ }
              throw "No wxWidgets libraries under $dest. The dependency build did not complete; refusing to publish or cache this tree."
          }
          $size = [math]::Round((Get-ChildItem $dest -Recurse -File -ErrorAction SilentlyContinue |
                  Measure-Object -Property Length -Sum).Sum / 1MB)
          Write-Host "wxWidgets present ($($wx.Name)); dependency bundle is $size MB."

      - name: Build on Mac ${{ inputs.arch }}
        if: inputs.os == 'macos-14'
        working-directory: ${{ github.workspace }}
        run: |
            brew install automake texinfo ninja libtool
            brew list
            mkdir -p ${{ github.workspace }}/deps/build_${{ inputs.arch }}
            mkdir -p ${{ github.workspace }}/deps/build_${{ inputs.arch }}/OrcaSlicer_dep_${{ inputs.arch }}
            brew uninstall --ignore-dependencies zstd
            ./build_release_macos.sh -dpx -a ${{ inputs.arch }} -t 10.15 -1
            brew install zstd


      - name: Install Ubuntu Build Dependencies
        if: inputs.os == 'ubuntu-20.04' || inputs.os == 'ubuntu-24.04'
        working-directory: ${{ github.workspace }}
        env:
          apt-cmd: ${{ (inputs.os == 'ubuntu-20.04' && 'apt-fast') || (inputs.os == 'ubuntu-24.04' && 'sudo apt-get') || '' }}
          webkit-ver: ${{ (inputs.os == 'ubuntu-20.04' && '4.0') || (inputs.os == 'ubuntu-24.04' && '4.1') || '' }}
        run: |
            ${{ env.apt-cmd }} update
            ${{ env.apt-cmd }} install -y cmake git g++ build-essential libgl1-mesa-dev m4 \
            libwayland-dev libxkbcommon-dev wayland-protocols extra-cmake-modules pkgconf \
            libglu1-mesa-dev libcairo2-dev libgtk-3-dev libsoup2.4-dev libwebkit2gtk-${{ env.webkit-ver }}-dev \
            libgstreamer1.0-dev libgstreamer-plugins-good1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-bad libosmesa6-dev wget sudo autoconf curl libunwind-dev texinfo

      - name: Build on Ubuntu
        if: inputs.os == 'ubuntu-20.04' || inputs.os == 'ubuntu-24.04'
        working-directory: ${{ github.workspace }}
        run: |
            mkdir -p ${{ github.workspace }}/deps/build
            mkdir -p ${{ github.workspace }}/deps/build/destdir
            sudo ./BuildLinux.sh -ur
            sudo chown $USER -R ./
            ./BuildLinux.sh -dr
            cd deps/build
            tar -czvf OrcaSlicer_dep_ubuntu_$(date +"%Y%m%d").tar.gz destdir


      # Upload Artifacts
      - name: Upload Mac ${{ inputs.arch }} artifacts
        if: inputs.os == 'macos-14'
        uses: actions/upload-artifact@v7
        with:
          name: Orca-Flashforge_dep_mac_${{ inputs.arch }}_${{ env.date }}
          path: ${{ github.workspace }}/deps/build_${{ inputs.arch }}/Orca-Flashforge_dep*.tar.gz

      - name: Upload Windows artifacts
        if: startsWith(inputs.os, 'windows')
        uses: actions/upload-artifact@v7
        with:
          name: Orca-Flashforge_dep_win64_${{ env.date }}
          path: ${{ github.workspace }}/deps/build/Orca-Flashforge_dep*.zip
          if-no-files-found: error # an empty deps zip means the dependency build quietly failed

      - name: Upload Ubuntu artifacts
        if: ${{ ! env.ACT && inputs.os == 'ubuntu-20.04' || inputs.os == 'ubuntu-24.04' }}
        env:
          ubuntu-ver: ${{ (inputs.os == 'ubuntu-20.04' && '2004') || (inputs.os == 'ubuntu-24.04' && '2404') || '' }}
        uses: actions/upload-artifact@v7
        with:
          name: OrcaSlicer_dep_ubuntu_${{ env.ubuntu-ver }}_${{ env.date }}
          path: ${{ github.workspace }}/deps/build/OrcaSlicer_dep_ubuntu_*.tar.gz

      # Explicit save rather than actions/cache's automatic post step: that one runs
      # even when the job failed, which is how a half-built dependency tree gets
      # cached under a key every later run then trusts.
      - name: save deps cache
        if: success()
        uses: actions/cache/save@v6
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ inputs.cache-key }}

  build_orca:
    name: Build OrcaSlicer
    needs: [build_deps]
    if: ${{ !cancelled() && !inputs.build-deps-only && (inputs.valid-cache == true && needs.build_deps.result == 'skipped') || (inputs.valid-cache != true && success()) }}
    uses: ./.github/workflows/build_orca.yml
    with:
      cache-key: ${{ inputs.cache-key }}
      cache-path: ${{ inputs.cache-path }}
      os: ${{ inputs.os }}
      arch: ${{ inputs.arch }}
    secrets: inherit

