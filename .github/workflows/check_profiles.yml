name: Check profiles
# Manual-only on this fork. scripts/orca_extra_profile_check.py reports
# "Errors found in 61 profile files" against FlashForge's shipped profiles, so
# the PR trigger is a guaranteed red X on every PR that touches profiles or this
# file. Re-enable the trigger once the profiles pass the validator.
on: 
  # pull_request:
  #   branches: 
  #   - main 
  #   paths:
  #   - 'resources/profiles/**'
  #   - ".github/workflows/check_profiles.yml"

  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'     
        required: true
        default: 'warning'


jobs:
  check_translation:
    name: Check profiles
    runs-on: ubuntu-24.04
    steps:  
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run extra JSON check
        run: |
          python3 ./scripts/orca_extra_profile_check.py

      # download
      - name: Download 
        working-directory: ${{ github.workspace }}
        run: |
          curl -LJO https://github.com/SoftFever/Orca_tools/releases/download/1/OrcaSlicer_profile_validator
          chmod +x ./OrcaSlicer_profile_validator

      # validate profiles
      - name: validate system profiles
        run: |
          ./OrcaSlicer_profile_validator -p ${{ github.workspace }}/resources/profiles -l 2

      - name: validate custom presets
        working-directory: ${{ github.workspace }}
        run: |
          curl -LJO https://github.com/SoftFever/OrcaSlicer/releases/download/nightly-builds/orca_custom_preset_tests.zip
          unzip ./orca_custom_preset_tests.zip -d ${{ github.workspace }}/resources/profiles
          ./OrcaSlicer_profile_validator -p ${{ github.workspace }}/resources/profiles -l 2




